<button type="button" id="totop" class="totop" aria-label="ページの先頭に戻る" hidden>
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 19V6M12 6l-6 6M12 6l6 6" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

  <div class="sheet-head">
    <button type="button" class="nav-icon sheet-close" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="sheet-body">
<!--MENU_CARDS-->
    <ul class="sheet-list" id="menu-list"></ul>
  </div>
</div>

<div class="sheet" id="search-sheet" role="dialog" aria-modal="true" aria-label="サイト内を検索" hidden>
  <div class="sheet-head">
    <button type="button" class="nav-icon sheet-close" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="sheet-body">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M15.4 15.4L20 20" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>
      <input type="search" id="search-input" placeholder="やりたいことでも探せます（例: 形を変えたい）"
             autocomplete="off" spellcheck="false" aria-label="検索語">
    </div>
    <div class="ask" id="ask" hidden>
      <div class="ask-bar">
        <button type="button" class="ask-go" id="ask-go" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3.5l1.9 4.9 4.9 1.9-4.9 1.9L12 17.1l-1.9-4.9-4.9-1.9 4.9-1.9z"

            <path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"
                  fill="currentColor"/>
          </svg>
          <span>この言葉で AI に聞く</span>
        </button>
        <span class="ask-beta">Beta 版</span>
      </div>
    </div>
    <p class="search-hint" id="search-hint">よく見るところ</p>

  </div>
</div>

<!--SEARCH_DATA-->

<script>
  /* 先頭に戻るボタン。少しスクロールしてから出す。 */
  (function () {
    var button = document.getElementById("totop");
    if (!button) { return; }

    function update() { button.hidden = window.scrollY < 400; }

    button.addEventListener("click", function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });

    window.addEventListener("scroll", update, { passive: true });
    update();
  })();

  /* スクロールに合わせて、節が下からすっと出てくる。

     大事なのは「動かない環境でも全部読める」こと。隠す指定はJSで後から付けるので、
     JSが動かなければ最初から見えている。動きを減らす設定の人には何もしない。 */
  (function () {
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || !("IntersectionObserver" in window)) { return; }

    var targets = document.querySelectorAll(
      ".stage, .tile, .pillar, .pipe, .thumb, .nodecard, .gloss-cat, .linkset, .entry");
    if (!targets.length) { return; }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) { return; }
        entry.target.classList.remove("reveal");
        observer.unobserve(entry.target);
      });
    }, { rootMargin: "0px 0px 25% 0px", threshold: 0 });

    Array.prototype.forEach.call(targets, function (el, index) {
      var box = el.getBoundingClientRect();
      if (box.top < window.innerHeight * 0.92) { return; }
      el.classList.add("reveal");
      el.style.transitionDelay = (index % 4) * 40 + "ms";
      observer.observe(el);
    });
  })();

  /* 全画面メニューと検索。

     スマホではタブがバーに入りきらないので、ハンバーガーから全画面で開く。
     項目は上から順に1つずつ現れ、背後のページはぼかして沈める。 */
  (function () {
    var layout = document.querySelector(".layout");
    var menuSheet = document.getElementById("menu-sheet");
    var searchSheet = document.getElementById("search-sheet");
    var menuList = document.getElementById("menu-list");
    var input = document.getElementById("search-input");
    var results = document.getElementById("search-results");
    var hint = document.getElementById("search-hint");
    var dataEl = document.getElementById("search-data");
    if (!menuSheet || !searchSheet || !dataEl) { return; }

    var data = JSON.parse(dataEl.textContent);
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var open = null;
    var lastFocus = null;
    var cursor = 0;

    /* ---- 開閉 ---- */

    function stagger(items, step) {
      items.forEach(function (li, i) {
        li.classList.remove("in");
        if (reduce) { li.classList.add("in"); return; }
        setTimeout(function () { li.classList.add("in"); }, 40 + i * step);
      });
    }

    function show(sheet) {
      if (open) { hide(); }
      lastFocus = document.activeElement;
      sheet.hidden = false;
      if (layout) { layout.classList.add("dimmed"); }
      document.body.style.overflow = "hidden";
      open = sheet;
    }

    function hide() {
      if (!open) { return; }
      var items = open.querySelectorAll("li");
      Array.prototype.forEach.call(items, function (li) { li.classList.remove("in"); });
      open.hidden = true;
      if (layout) { layout.classList.remove("dimmed"); }
      document.body.style.overflow = "";
      if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
      open = null;
    }

    /* ---- 降りてくるパネル ----

       乗せたら開き、離れたら少し待ってから閉じる。待つのは、見出しから
       パネルへマウスを動かす途中で閉じないようにするため。
       高さは中身を測って入れる。中身が変わっても付け直さなくてよい。 */

    (function () {
      var bar = document.querySelector(".sidenav");
      var drops = Array.prototype.slice.call(document.querySelectorAll(".nav-drop"));
      if (!bar || !drops.length) { return; }
      var openDrop = null;
      var timer = null;

      function panelOf(drop) { return drop.querySelector(".mega"); }

      function close(drop) {
        if (!drop) { return; }
        panelOf(drop).classList.remove("open");
        drop.firstElementChild.setAttribute("aria-expanded", "false");
        if (openDrop === drop) { openDrop = null; }
        if (!openDrop) { bar.classList.remove("nav-lit"); }
      }

      function open(drop) {
        if (openDrop === drop) { return; }
        close(openDrop);
        var panel = panelOf(drop);
        var inner = panel.firstElementChild;
        panel.style.setProperty("--mega-h", inner.offsetHeight + "px");
        panel.classList.add("open");
        drop.firstElementChild.setAttribute("aria-expanded", "true");
        bar.classList.add("nav-lit");
        openDrop = drop;
      }

      function later(fn) {
        window.clearTimeout(timer);
        timer = window.setTimeout(fn, 180);
      }

      drops.forEach(function (drop) {
        drop.addEventListener("mouseenter", function () {
          window.clearTimeout(timer);
          open(drop);
        });
        drop.addEventListener("mouseleave", function () {
          later(function () { close(drop); });
        });
        /* キーボードで辿ってきたときも開く */
        drop.addEventListener("focusin", function () {
          window.clearTimeout(timer);
          open(drop);
        });
        drop.addEventListener("focusout", function (event) {
          if (drop.contains(event.relatedTarget)) { return; }
          later(function () { close(drop); });
        });
        /* 中の行き先を押したら閉じる */
        panelOf(drop).addEventListener("click", function () { close(drop); });
      });

      /* 見出し自身を押したときも、行き先へ飛んだうえで閉じる */
      drops.forEach(function (drop) {
        drop.firstElementChild.addEventListener("click", function () {
          window.setTimeout(function () { close(drop); }, 0);
        });
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && openDrop) {
          var head = openDrop.firstElementChild;
          close(openDrop);
          head.focus();
        }
      });

      /* 画面幅が変わると中身の高さも変わる。開いたままなら測り直す */
      window.addEventListener("resize", function () {
        if (!openDrop) { return; }
        var panel = panelOf(openDrop);
        panel.style.setProperty("--mega-h",
          panel.firstElementChild.offsetHeight + "px");
      });
    }());

    /* ---- メニュー ---- */

    function menuItem(control) {
      var item = document.createElement("li");
      var clone = control.cloneNode(true);
      clone.classList.remove("nav-tab");
      clone.removeAttribute("id");
      if (clone.classList.contains("nav-ext")) { clone.classList.add("sheet-ext"); }
      clone.addEventListener("click", function () {
        if (control.tagName === "BUTTON") { control.click(); }
        hide();
      });
      if (control.tagName === "BUTTON") { clone.setAttribute("type", "button"); }
      item.appendChild(clone);
      return item;
    }

    /* 上のバーは4つに畳んであるが、スマホでは畳まずに全部並べる。
       束の見出しを挟んでから、その中の行き先を並べる */
    function buildMenu() {
      menuList.textContent = "";
      var source = document.querySelector(".sidenav .nav-menu");
      if (!source) { return; }
      Array.prototype.forEach.call(source.children, function (li) {
        var control = li.firstElementChild;
        if (!control) { return; }
        var kids = li.querySelectorAll(".mega-col li > :first-child");
        if (!kids.length) { menuList.appendChild(menuItem(control)); return; }
        var head = document.createElement("li");
        head.className = "sheet-group";
        head.textContent = control.textContent.trim();
        menuList.appendChild(head);
        Array.prototype.forEach.call(kids, function (kid) {
          menuList.appendChild(menuItem(kid));
        });
      });
    }

    /* 親ページにはハンバーガーが無い。無いページで落ちないようにする */
    var menuOpen = document.getElementById("menu-open");
    if (menuOpen) {
      menuOpen.addEventListener("click", function () {
        buildMenu();
        show(menuSheet);
        stagger(Array.prototype.slice.call(menuList.children), 55);
      });
    }

    /* ---- 検索 ---- */

    /* 表記ゆれを吸収する。全角→半角、大文字→小文字、カタカナ→ひらがな。
       「リグ」と「りぐ」、「ＦＢＸ」と「fbx」を同じものとして扱う。 */
    function norm(s) {
      s = String(s || "");
      if (s.normalize) { s = s.normalize("NFKC"); }
      s = s.toLowerCase();
      return s.replace(/[ァ-ヶ]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0x60);
      });
    }

    var SYN = (data.syn && data.syn.groups || []).map(function (g) {
      return { label: g.label, words: g.words.map(norm),
               expand: g.expand.map(norm) };
    });
    var FILLERS = (data.syn && data.syn.fillers || []).map(norm)
      .sort(function (a, b) { return b.length - a.length; });

    /* 検索語の「言い回し」を落とす。「形を変えたい」→「形を変え」。
       言い換え辞書は落とす前の全文に当てるので、「やり方」も拾える。 */
    function stripFillers(q) {
      FILLERS.forEach(function (f) {
        if (f && q.length > f.length) { q = q.split(f).join(" "); }
      });
      return q.replace(/\s+/g, " ").trim();
    }

    /* 検索語から、探す語の一覧を作る。
       直接の語（重み 1.5）と、言い換え辞書で広げた語（重み 1）に分ける。 */
    function expandQuery(query) {
      var q = norm(query);
      var direct = stripFillers(q).split(" ").filter(function (t) {
        return t.length > 0;
      });
      var hits = [];
      var extra = [];
      SYN.forEach(function (g) {
        /* 検索語が辞書の語を含む（「形を変えたい」⊃「形を変」）なら当たり。
           逆向き（辞書の語が検索語で始まる）は、ほぼ全部を打ったときだけ。
           そうしないと「ノイズ」が「ノイズが出」に当たってレンダリングまで広がる */
        var matched = g.words.some(function (w) {
          return w && (q.indexOf(w) !== -1 ||
                       (w.indexOf(q) === 0 && q.length >= w.length * 0.75));
        });
        if (matched) {
          hits.push(g.label);
          g.expand.forEach(function (e) {
            if (extra.indexOf(e) === -1 && direct.indexOf(e) === -1) {
              extra.push(e);
            }
          });
        }
      });
      /* 英字だけの検索語に2文字の近さを使うと、"on" "io" のような
         どこにでもある並びで関係ないものが上がる。日本語のときだけ使う */
      return { direct: direct, extra: extra, groups: hits,
               grams: bigrams(stripFillers(q)),
               japanese: /[぀-ヿ一-鿿]/.test(q) };
    }

    /* 項目の中身を、ラベル・タグ・本文に分けて正規化しておく。1回だけ作る */
    data.items.forEach(function (item) {
      item._label = norm(item.label);
      item._tags = norm((item.tags || []).join(" ") + " " + item.kind);
      item._text = norm((item.note || "") + " " + (item.reading || "") +
                        " " + (item.body || ""));
    });

    function termScore(item, term, weight) {
      if (!term) { return 0; }
      var s = 0;
      if (item._label.indexOf(term) === 0) { s += 14; }
      else if (item._label.indexOf(term) !== -1) { s += 10; }
      if (item._tags.indexOf(term) !== -1) { s += 6; }
      if (item._text.indexOf(term) !== -1) { s += 3; }
      return s * weight;
    }

    function score(item, plan) {
      var total = 0;
      var directHit = 0;
      plan.direct.forEach(function (t) {
        var s = termScore(item, t, 1.5);
        if (s > 0) { directHit += 1; }
        total += s;
      });
      plan.extra.forEach(function (t) { total += termScore(item, t, 1); });
      /* 複数語で打ったとき、全部当たったものを上に */
      if (plan.direct.length > 1 && directHit === plan.direct.length) {
        total *= 1.6;
      }
      /* 「骨を曲げると痩せる」のように文で打ったとき、文そのものに近い
         題を上げる。言い換えだけだと、関係する実験がみな同じ点になって
         いちばん近い1件が埋もれる */
      if (plan.grams.length >= 3 && plan.japanese) {
        var nearLabel = gramRatio(item._label, plan.grams);
        var nearText = gramRatio(item._text, plan.grams);
        if (nearLabel >= 0.3) { total += nearLabel * 30; }
        if (nearText >= 0.3) { total += nearText * 8; }
      }
      return total;
    }

    /* 何も当たらなかったときの最後の手。2文字ずつに切って、
       ラベルと説明にどれだけ含まれるかで近いものを出す。打ち間違い用 */
    function bigrams(s) {
      var out = [];
      s = s.replace(/\s+/g, "");
      for (var i = 0; i < s.length - 1; i++) { out.push(s.substr(i, 2)); }
      return out;
    }
    function gramRatio(hay, grams) {
      if (!grams.length) { return 0; }
      var hit = 0;
      grams.forEach(function (g) { if (hay.indexOf(g) !== -1) { hit += 1; } });
      return hit / grams.length;
    }
    function nearScore(item, grams) {
      if (!grams.length) { return 0; }
      var hay = item._label + " " + item._text;
      var hit = 0;
      grams.forEach(function (g) { if (hay.indexOf(g) !== -1) { hit += 1; } });
      return hit / grams.length;
    }

    function quickLinks() {
      return data.items.filter(function (item) {
        return item.kind === "ページ";
      }).concat(data.items.filter(function (item) {
        return item.kind === "実験";
      }).slice(-3).reverse());
    }

    function go(item) {
      hide();
      if (data.tabs && item.tab) {
        if (window.location.hash !== "#" + item.tab) {
          window.location.hash = "#" + item.tab;
        }
        if (item.anchor) {
          setTimeout(function () {
            var target = document.getElementById(item.anchor);
            if (target) {
              target.scrollIntoView({ behavior: reduce ? "auto" : "smooth",
                                      block: "start" });
            }
          }, 60);
        }
        /* 手順は、タブを開くだけでなくその手順そのものを開く。
           一覧から探し直させない */
        if (item.guide) {
          setTimeout(function () {
            var card = document.querySelector('[data-guide="' + item.guide + '"]');
            if (card) { card.click(); }
          }, 80);
        }
        return;
      }
      window.location.href = item.href;
    }

    /* 検索語に近い順に並べた全候補。検索の一覧と、AI に渡す根拠の両方で使う */
    function rankItems(query) {
      var plan = expandQuery(query);
      var list = data.items.map(function (item) {
        return { item: item, rank: score(item, plan) };
      }).filter(function (row) {
        return row.rank > 0;
      }).sort(function (a, b) {
        return b.rank - a.rank || a.item.label.length - b.item.label.length;
      }).map(function (row) { return row.item; });
      return { plan: plan, list: list };
    }

    function render(query) {
      var list;
      if (!query) {
        list = quickLinks().slice(0, 8);
        hint.textContent = "よく見るところ";
      } else {
        var ranked = rankItems(query);
        var plan = ranked.plan;
        list = ranked.list.slice(0, plan.extra.length ? 12 : 8);

        if (plan.groups.length) {
          /* 言い換えで広げたときは、何として探したかを見せる */
          hint.textContent = "「" + plan.groups.slice(0, 3).join("」「") +
            "」として探しています";
        } else {
          hint.textContent = list.length ? "候補" : "";
        }

        if (!list.length) {
          var grams = bigrams(norm(stripFillers(norm(query))));
          list = data.items.map(function (item) {
            return { item: item, rank: nearScore(item, grams) };
          }).filter(function (row) {
            return row.rank >= 0.5;
          }).sort(function (a, b) {
            return b.rank - a.rank;
          }).slice(0, 6).map(function (row) { return row.item; });
          if (list.length) { hint.textContent = "近いもの"; }
        }
      }

      results.textContent = "";
      cursor = 0;
      if (!list.length) {
        var empty = document.createElement("li");
        empty.className = "search-empty";
        empty.textContent = "見つかりませんでした";
        empty.classList.add("in");
        results.appendChild(empty);
        return;
      }

      list.forEach(function (item, index) {
        var li = document.createElement("li");
        var button = document.createElement("button");
        button.type = "button";
        if (index === 0) { button.classList.add("active"); }

        var kind = document.createElement("span");
        kind.className = "r-kind";
        kind.textContent = item.kind;

        var text = document.createElement("span");
        text.className = "r-text";
        var label = document.createElement("span");
        label.className = "r-label";
        label.textContent = item.label;
        text.appendChild(label);
        if (item.note) {
          var note = document.createElement("span");
          note.className = "r-note";
          note.textContent = item.note;
          text.appendChild(note);
        }

        button.appendChild(kind);
        button.appendChild(text);
        button.addEventListener("click", function () { go(item); });
        li.appendChild(button);
        results.appendChild(li);
      });
      stagger(Array.prototype.slice.call(results.children), 26);
      results.dataset.list = list.length;
      results._items = list;
    }

    function moveCursor(delta) {
      var buttons = results.querySelectorAll("button");
      if (!buttons.length) { return; }
      buttons[cursor].classList.remove("active");
      cursor = (cursor + delta + buttons.length) % buttons.length;
      buttons[cursor].classList.add("active");
      buttons[cursor].scrollIntoView({ block: "nearest" });
    }

    var searchPlaceholder = input.placeholder;

    document.getElementById("search-open").addEventListener("click", function () {
      hint.hidden = false;
      results.hidden = false;
      input.placeholder = searchPlaceholder;
      show(searchSheet);
      input.value = "";
      render("");
      setTimeout(function () { input.focus(); }, 30);
    });

    /* 検索の横の AI アイコン。AI が使える環境でだけ出す。
       検索とは別の、チャットの画面（#chat-sheet）を開く。
       会話はページを閉じるまで残るので、閉じて開き直しても続きから話せる。 */
    var askOpen = document.getElementById("ask-open");
    var chatSheet = document.getElementById("chat-sheet");
    var chatInput = document.getElementById("chat-input");
    var chatSend = document.getElementById("chat-send");
    var chatScroll = document.getElementById("chat-scroll");
    var chatWelcome = document.getElementById("chat-welcome");

    function openChat(text) {
      show(chatSheet);
      if (typeof text === "string") { chatInput.value = text; }
      growInput();
      updateAsk();
      setTimeout(function () { chatInput.focus(); }, 30);
    }

    /* 入力欄は打った行数に合わせて伸ばす（6行まで） */
    function growInput() {
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + "px";
    }

    if (askOpen) {
      askOpen.addEventListener("click", function () { openChat(); });
    }

    input.addEventListener("input", function () {
      render(input.value.trim());
    });

    /* ---- AI に聞く ----

       Claude 版のページ（Artifact）は window.claude の sample を使う。
       GitHub Pages 版は window.claude が無いので、2026-09-22 から
       houdini-relay（Cloudflare Workers 経由の Gemini）を代わりに使う。
       どちらも sampleFn(msgs, opts) -> Promise<{text, truncated}> という
       同じ形にして、下の send() 以降は呼び分けをしない。

       正確さのために、質問のたびにサイト内をあいまい検索して中身を添え、
       「それ以外を根拠にしない」と頼む。答えの下には、添えた記録をリンクで
       並べる。根拠を自分でたどれるようにするため。Gemini 側は無料枠なので、
       件数と抜粋を Claude 版より絞る（askContext 内）。 */
    var RELAY_URL = "https://houdini-relay.fko2547009.workers.dev/";

    function relaySample(msgs, opts) {
      return fetch(RELAY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: msgs }),
        signal: opts && opts.signal
      }).then(function (res) {
        return res.json().catch(function () {
          throw errorWith("upstream_error", "応答が読めませんでした");
        }).then(function (data) {
          if (data && data.code) { throw errorWith(data.code, data.message || ""); }
          return data;
        });
      }, function (e) {
        if (e && e.name === "AbortError") { throw errorWith("cancelled", ""); }
        throw errorWith("upstream_error", "");
      });
    }

    function errorWith(code, message) {
      var e = new Error(message || code);
      e.code = code;
      return e;
    }

    var ask = document.getElementById("ask");
    var askGo = document.getElementById("ask-go");
    var askStop = document.getElementById("ask-stop");
    var askClear = document.getElementById("ask-clear");
    var askLog = document.getElementById("ask-log");
    var sampleFn = null;
    var turns = [];
    var askCtl = null;

    var RULES = [
      "あなたは Saito Production の「Houdini 研究部」というサイトの案内係です。",
      "読み手は Houdini を学んでいる人です。日本語の、やわらかい丁寧語で答えてください。",
      "答えの根拠は、質問に添えた「このサイトの資料」だけにしてください。",
      "本文では、資料に書かれていないことを推測で埋めず、「このサイトではまだ確かめていません」とはっきり言ってください。",
      "数値は資料に書かれた値をそのまま使い、丸めたり新しく作ったりしないでください。",
      "実験に触れるときは「実験052」のように3桁の番号で書いてください。",
      "作り方を聞かれて、資料に「実践」があれば、その実践の名前を挙げてください。",
      "最初の1〜2文で結論を言い、そのあと必要なら要点を3つまで。見出しや表は使わず、箇条書きは「・」で書いてください。",
      "ノードのパラメータの調整や VEX の書き方を聞かれて、資料だけでは足りないときに限り、本文のあとに「考察（未確認）」という1行を置き、その下にあなたの一般的な知識から「こうすると効くかもしれません」という案を2つまで書いてよいです。" +
        "パラメータ名は Houdini の実際の表示名で書き、その見出しの最後の文は必ず「このサイトではまだ確かめていません。」にしてください。数値の実測結果のように書かないでください。これが使ってよい唯一の見出しです。"
    ].join("\n");

    function askContext(query) {
      // Gemini（無料枠）を使う relay 版は、件数と抜粋を Claude 版より絞る
      var viaRelay = sampleFn === relaySample;
      var count = viaRelay ? 4 : 10;
      var bodyLimit = viaRelay ? 220 : 360;
      var list = rankItems(query).list.slice(0, count);
      var text = list.map(function (item, i) {
        var parts = ["[" + (i + 1) + "] " + item.kind + "：" + item.label];
        if (item.note) { parts.push("要点: " + item.note); }
        if (item.body) { parts.push("内容: " + String(item.body).slice(0, bodyLimit)); }
        if (item.facts) { parts.push("わかったこと: " + item.facts); }
        return parts.join("\n");
      }).join("\n\n");
      return { list: list, text: text };
    }

    var expByNo = {};
    data.items.forEach(function (item) { if (item.exp) { expByNo[item.exp] = item; } });

    /* 答えの中の「実験052」を、その実験へのリンクにする */
    /* 「考察（未確認）」から下は、資料に無い一般知識の案。
       本文と混ざらないよう、枠で囲って分ける */
    function fillAnswer(el, text) {
      el.textContent = "";
      var s = String(text);
      var at = s.indexOf("考察（未確認）");
      if (at === -1) { fillLinks(el, s); return; }
      fillLinks(el, s.slice(0, at).replace(/\s+$/, ""));
      var box = document.createElement("div");
      box.className = "ask-guess";
      var head = document.createElement("span");
      head.className = "ask-guess-head";
      head.textContent = "考察（未確認）";
      box.appendChild(head);
      var rest = document.createElement("div");
      fillLinks(rest, s.slice(at + "考察（未確認）".length).replace(/^[\s：:]+/, ""));
      box.appendChild(rest);
      el.appendChild(box);
    }

    function fillLinks(el, text) {
      String(text).split(/(実験\d{3})/).forEach(function (part) {
        var m = /^実験(\d{3})$/.exec(part);
        if (m && expByNo[m[1]]) {
          var target = expByNo[m[1]];
          var a = document.createElement("a");
          a.href = target.href;
          a.textContent = part;
          a.addEventListener("click", function (event) {
            event.preventDefault();
            go(target);
          });
          el.appendChild(a);
        } else {
          el.appendChild(document.createTextNode(part));
        }
      });
    }

    function bubble(kind, text) {
      var div = document.createElement("div");
      div.className = "ask-msg ask-msg--" + kind;
      var body = document.createElement("div");
      body.className = "ask-body";
      body.textContent = text;
      div.appendChild(body);
      (currentTurn || askLog).appendChild(div);
      chatWelcome.hidden = true;
      toBottom();
      return div;
    }

    /* 入力欄が上にあるので、新しい1往復（質問と答え）を一番上に差し込み、
       見る位置も一番上に戻す。スマホでキーボードが出ていても、打った言葉と
       その答えが同じ画面に入る（2026-09-22、ユーザーの要望） */
    var currentTurn = null;

    function newTurn() {
      currentTurn = document.createElement("div");
      currentTurn.className = "ask-turn";
      askLog.insertBefore(currentTurn, askLog.firstChild);
    }

    function toBottom() {
      chatScroll.scrollTop = 0;
    }

    function addRefs(msg, list) {
      if (!list.length) { return; }
      var box = document.createElement("div");
      box.className = "ask-refs";
      var head = document.createElement("span");
      head.className = "ask-refs-head";
      head.textContent = "根拠にした記録";
      box.appendChild(head);
      list.slice(0, 5).forEach(function (item) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = item.kind + "｜" + item.label;
        b.addEventListener("click", function () { go(item); });
        box.appendChild(b);
      });
      msg.appendChild(box);
    }

    function askNote(msg, text) {
      var p = document.createElement("p");
      p.className = "ask-warn";
      p.textContent = text;
      msg.appendChild(p);
    }

    function updateAsk() {
      if (!sampleFn) { return; }
      askGo.disabled = !input.value.trim();
      chatSend.disabled = !chatInput.value.trim() || !!askCtl;
    }

    function askBusy(on) {
      askStop.hidden = !on;
      chatSend.hidden = on;
      askClear.hidden = on || !turns.length;
      updateAsk();
    }

    /* 無料枠の Gemini は、たまに一度だけ失敗して次は通る（2026-09-22、
       同じ質問が一度「接続が切れた」になり、送り直すと答えた）。
       そこで、止めた・断られた以外の失敗は、少し待って1回だけ自動で送り直す。 */
    var RETRY_ONCE = ["upstream_error", "rate_limited", "empty_completion"];

    function sampleWithRetry(msgs, opts, onRetry) {
      return sampleFn(msgs, opts).catch(function (e) {
        var code = (e && e.code) || "upstream_error";
        if (RETRY_ONCE.indexOf(code) === -1 || (opts.signal && opts.signal.aborted)) { throw e; }
        if (onRetry) { onRetry(); }
        return new Promise(function (resolve) {
          setTimeout(resolve, code === "rate_limited" ? 4000 : 1500);
        }).then(function () {
          if (opts.signal && opts.signal.aborted) { throw errorWith("cancelled", ""); }
          return sampleFn(msgs, opts);
        });
      });
    }

    /* これが返ってきたら、この閲覧では AI を使えない。二度と頼まない */
    var HIDE = ["not_granted", "sampling_disabled", "not_declared",
                "capability_disabled", "capability_removed", "tools_unavailable"];

    function send() {
      var q = chatInput.value.trim();
      if (!sampleFn || !q || askCtl) { return; }
      chatInput.value = "";
      growInput();
      // スマホでは送ったらキーボードを閉じ、答えが画面に入るようにする
      if (window.matchMedia("(pointer: coarse)").matches) { chatInput.blur(); }
      var ctx = askContext(q);
      var msgs = [{ role: "user", content: RULES }]
        .concat(turns.slice(-8))
        .concat([{ role: "user", content:
          "質問: " + q + "\n\nこのサイトの資料:\n" +
          (ctx.text || "（この質問に当たる資料は見つかりませんでした）") }]);

      newTurn();
      bubble("q", q);
      var msg = bubble("a", "考えています…");
      var body = msg.querySelector(".ask-body");
      msg.classList.add("is-thinking");

      askCtl = new AbortController();
      askBusy(true);
      sampleWithRetry(msgs, {
        cache: false,
        signal: askCtl.signal,
        onText: function (u) {
          msg.classList.remove("is-thinking");
          fillAnswer(body, u.text);
          toBottom();
        }
      }, function () {
        body.textContent = "つながりにくいので、もう一度送っています…";
      }).then(function (res) {
        msg.classList.remove("is-thinking");
        fillAnswer(body, res.text);
        addRefs(msg, ctx.list);
        turns.push({ role: "user", content: "質問: " + q });
        turns.push({ role: "assistant", content: res.text });
        if (res.truncated) { askNote(msg, "答えが途中で切れました。質問を短くしてみてください。"); }
      }).catch(function (e) {
        msg.classList.remove("is-thinking");
        var code = (e && e.code) || "upstream_error";
        if (e && e.text && code !== "refused") { fillAnswer(body, e.text); }
        else { body.textContent = ""; }
        if (code === "cancelled") {
          if (!(e && e.text)) { msg.remove(); }
          return;
        }
        if (HIDE.indexOf(code) !== -1) {
          askNote(msg, "この閲覧環境では AI を使えません。検索はそのまま使えます。");
          sampleFn = null;
          askGo.disabled = true;
          return;
        }
        askNote(msg, {
          rate_limited: "いま混み合っています。少し待ってから、もう一度押してください。",
          session_expired: "サインインが切れました。もう一度サインインしてください。",
          refused: "この質問には答えられませんでした。言い方を変えてみてください。",
          empty_completion: "答えが空でした。質問を短くしてみてください。",
          prompt_too_large: "質問が長すぎました。短くしてみてください。"
        }[code] || "つながりませんでした（自動で1回送り直しても通りませんでした）。少し待ってから、もう一度送ってください。");
        if (e && e.message && e.message !== code && sampleFn === relaySample) {
          var detail = document.createElement("p");
          detail.className = "ask-detail";
          detail.textContent = "詳しく: " + String(e.message).slice(0, 160);
          msg.appendChild(detail);
        }
      }).then(function () {
        askCtl = null;
        askBusy(false);
        toBottom();
      });
    }

    /* 検索画面の「この言葉で AI に聞く」: 打った言葉を持ってチャットへ移り、そのまま送る */
    askGo.addEventListener("click", function () {
      var q = input.value.trim();
      if (!q) { return; }
      openChat(q);
      send();
    });
    chatSend.addEventListener("click", send);
    askStop.addEventListener("click", function () { if (askCtl) { askCtl.abort(); } });
    askClear.addEventListener("click", function () {
      turns = [];
      askLog.textContent = "";
      askClear.hidden = true;
      chatWelcome.hidden = false;
      chatInput.focus();
    });
    input.addEventListener("input", updateAsk);
    chatInput.addEventListener("input", function () { growInput(); updateAsk(); });
    chatInput.addEventListener("keydown", function (event) {
      // 日本語の変換中の Enter は確定なので送らない
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        send();
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll("#chat-starters button"), function (b) {
      b.addEventListener("click", function () {
        chatInput.value = b.textContent;
        send();
      });
    });

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("sample").then(function (s) {
        if (!s) { return; }
        sampleFn = s;
        ask.hidden = false;
        if (askOpen) { askOpen.hidden = false; }
        updateAsk();
      }, function () {});
    } else if (RELAY_URL) {
      sampleFn = relaySample;
      ask.hidden = false;
      var engine = document.getElementById("ask-engine");
      if (engine) { engine.textContent = "Google の Gemini（無料枠）で答えます。混んでいると答えられないことがあります。"; }
      if (askOpen) { askOpen.hidden = false; }
      updateAsk();
    }

    input.addEventListener("keydown", function (event) {
      if (event.key === "ArrowDown") { event.preventDefault(); moveCursor(1); }
      else if (event.key === "ArrowUp") { event.preventDefault(); moveCursor(-1); }
      else if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        askGo.click();
      }
      else if (event.key === "Enter") {
        event.preventDefault();
        if (results._items && results._items[cursor]) { go(results._items[cursor]); }
      }
    });

    /* ---- 共通 ---- */

    Array.prototype.forEach.call(document.querySelectorAll(".sheet-close"),
      function (button) { button.addEventListener("click", hide); });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && open) { hide(); return; }
      var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(
        (document.activeElement || {}).tagName || "");
      if (!open && !typing && (event.key === "/" ||
          ((event.metaKey || event.ctrlKey) && event.key === "k"))) {
        event.preventDefault();
        document.getElementById("search-open").click();
      }
    });
  })();

  /* #expNNN で飛んだとき、着地がずれる問題。

     ブラウザは HTML を読んだ時点で目的の記事へ飛ぶが、そのあと画像が
     次々に読み込まれて上のほうが伸びる。結果、狙った記事はずっと下に
     押し出されてしまう。画像に寸法を書いていないページではこれが起きる。

     そこで、画像が届くたびに飛び先へ合わせ直す。人が自分でスクロール
     したらそこで止める（勝手に動かされるのが一番うっとうしいため）。 */
  (function () {
    if (!window.location.hash) { return; }
    var id = window.location.hash.slice(1);
    var stopped = false;
    var until = Date.now() + 6000;

    function target() {
      try { return document.getElementById(decodeURIComponent(id)); }
      catch (e) { return document.getElementById(id); }
    }
    function fix() {
      if (stopped) { return; }
      var el = target();
      if (el) { el.scrollIntoView({ behavior: "auto", block: "start" }); }
    }
    function stop() { stopped = true; }

    window.addEventListener("wheel", stop, { passive: true, once: true });
    window.addEventListener("touchmove", stop, { passive: true, once: true });
    window.addEventListener("keydown", function (event) {
      if (event.key && event.key.indexOf("Arrow") === 0) { stop(); }
      if (event.key === " " || event.key === "PageDown" ||
          event.key === "PageUp" || event.key === "Home" ||
          event.key === "End") { stop(); }
    });

    Array.prototype.forEach.call(document.images, function (img) {
      if (img.complete) { return; }
      img.addEventListener("load", fix);
      img.addEventListener("error", fix);
    });
    window.addEventListener("load", function () {
      fix();
      var timer = setInterval(function () {
        if (stopped || Date.now() > until) { clearInterval(timer); return; }
        fix();
      }, 250);
    });
    fix();
  })();

  /* 実験ログを2編に分けたので、古いリンク（#exp014 など）が
     この編に無いことがある。その場合は、正しい編へ送る。 */
  (function () {
    var match = (window.location.hash || "").match(/^#exp(\d+)$/);
    if (!match) { return; }
    if (document.getElementById("exp" + match[1])) { return; }
    if (!document.querySelector(".entry[id^=exp]")) { return; }
    var dataEl = document.getElementById("search-data");
    if (!dataEl) { return; }
    var items = JSON.parse(dataEl.textContent).items;
    for (var i = 0; i < items.length; i += 1) {
      if (items[i].exp === match[1]) {
        window.location.replace(items[i].href);
        return;
      }
    }
  })();

  /* タグで実験カードを絞り込む。押すたびに切り替わる。 */
  (function () {
    var bar = document.getElementById("tagbar");
    var grid = document.getElementById("thumbs");
    if (!bar || !grid) { return; }
    var chips = Array.prototype.slice.call(bar.querySelectorAll(".tagchip"));
    var cards = Array.prototype.slice.call(grid.querySelectorAll(".thumb"));

    function apply(tag) {
      chips.forEach(function (chip) {
        chip.classList.toggle("is-on", chip.dataset.tag === tag);
      });
      cards.forEach(function (card) {
        var tags = (card.dataset.tags || "").split(" ");
        card.hidden = tag !== "" && tags.indexOf(tag) === -1;
      });
      try {
        if (tag) { history.replaceState(null, "", "#experiments"); }
      } catch (e) {}
    }

    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        apply(chip.classList.contains("is-on") ? "" : chip.dataset.tag);
      });
    });
  })();
</script>

<script>
  /* 2026-09-22 刷新: 上のバーのタブの列・明暗の切り替え・冒頭の帯（検索と重なったカード） */
  (function () {
    var root = document.documentElement;

    /* 明・暗・自動。選んだものは、この閲覧だけに覚えておく */
    function setTheme(m) {
      if (m === "light" || m === "dark") { root.setAttribute("data-theme", m); }
      else { root.removeAttribute("data-theme"); m = "system"; }
      Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.themeSet === m));
      });
      try { localStorage.setItem("hl-theme", m); } catch (e) {}
    }
    try { var saved = localStorage.getItem("hl-theme"); if (saved) { setTheme(saved); } } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function (b) {
      b.addEventListener("click", function () { setTheme(b.dataset.themeSet); });
    });

    /* いま居る区分のタブの列だけを出し、上の見出しに印を付ける */
    function syncNav() {
      var on = null;
      Array.prototype.forEach.call(document.querySelectorAll(".subnav"), function (sub) {
        var hit = sub.querySelector('[aria-selected="true"], [aria-current="page"]');
        sub.hidden = !hit;
        if (hit) { on = sub.dataset.g; }
      });
      Array.prototype.forEach.call(document.querySelectorAll(".nav-menu > li[data-g]"), function (li) {
        var c = li.firstElementChild;
        var self = c && (c.getAttribute("aria-selected") === "true" || c.getAttribute("aria-current") === "page");
        li.classList.toggle("is-on", on !== null ? li.dataset.g === on : !!self);
      });
    }
    if (window.MutationObserver) {
      var mo = new MutationObserver(syncNav);
      Array.prototype.forEach.call(document.querySelectorAll(".nav-tab"), function (t) {
        mo.observe(t, { attributes: true, attributeFilter: ["aria-selected"] });
      });
    }
    syncNav();

    /* 冒頭の帯の検索窓: 「探す」は検索の画面、「AI に聞く」はチャットの画面へ、打った言葉ごと渡す */
    var bq = document.getElementById("band-q");
    if (bq) {
      var bandFind = document.getElementById("band-find");
      var bandAi = document.getElementById("band-ai");
      var askOpen = document.getElementById("ask-open");
      bandFind.addEventListener("click", function () {
        var v = bq.value;
        document.getElementById("search-open").click();
        var si = document.getElementById("search-input");
        if (si && v) { si.value = v; si.dispatchEvent(new Event("input")); }
      });
      bq.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); bandFind.click(); }
      });
      if (askOpen && bandAi) {
        var showAi = function () { bandAi.hidden = askOpen.hidden; };
        showAi();
        if (window.MutationObserver) { new MutationObserver(showAi).observe(askOpen, { attributes: true, attributeFilter: ["hidden"] }); }
        bandAi.addEventListener("click", function () {
          var v = bq.value.trim();
          askOpen.click();
          var ci = document.getElementById("chat-input");
          if (ci && v) {
            ci.value = v;
            ci.dispatchEvent(new Event("input"));
            var cs = document.getElementById("chat-send");
            if (cs && !cs.disabled) { cs.click(); }
          }
        });
      }
    }

    /* 重なったカード: 5秒ごとに次へ。止める・前後・点・指でめくる */
    var deck = document.getElementById("deck");
    if (deck) {
      var cards = deck.querySelectorAll(".deck-card"), n = cards.length, cur = 0;
      var dots = document.getElementById("deck-dots");
      dots.innerHTML = Array.prototype.map.call(cards, function (c, i) {
        return '<button type="button" aria-label="' + (i + 1) + '枚目"></button>';
      }).join("");
      var dotBtns = dots.querySelectorAll("button");
      var narrow = window.matchMedia("(max-width: 720px)");
      function layout() {
        Array.prototype.forEach.call(cards, function (c, i) {
          var d = ((i - cur) % n + n) % n; if (d > n / 2) { d -= n; }
          var a = Math.abs(d);
          var step = narrow.matches ? 18 : 34, rot = narrow.matches ? 0 : d * 3;
          c.style.transform = "translateX(calc(-50% + " + (d * step) + "%)) scale(" + (1 - a * 0.1) + ") rotate(" + rot + "deg)";
          c.style.zIndex = String(10 - a);
          c.style.opacity = a > 2 ? "0" : String(1 - a * (narrow.matches ? 0.4 : 0.14));
          c.style.pointerEvents = a > 2 ? "none" : "auto";
          c.tabIndex = a === 0 ? 0 : -1;
          c.setAttribute("aria-hidden", String(a !== 0));
        });
        Array.prototype.forEach.call(dotBtns, function (b, i) { b.setAttribute("aria-current", String(i === cur)); });
      }
      function to(i) { cur = (i + n) % n; layout(); }
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var playing = !reduce, timer = null, play = document.getElementById("deck-play");
      var PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="3.2" height="12" rx="1" fill="currentColor"/><rect x="13.8" y="6" width="3.2" height="12" rx="1" fill="currentColor"/></svg>';
      var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
      function restart() { clearInterval(timer); if (playing) { timer = setInterval(function () { to(cur + 1); }, 5000); } }
      function setPlay(on) {
        playing = on;
        play.innerHTML = on ? PAUSE : PLAY;
        play.setAttribute("aria-label", on ? "自動の切り替えを止める" : "自動の切り替えを始める");
        restart();
      }
      play.addEventListener("click", function () { setPlay(!playing); });
      document.getElementById("deck-prev").addEventListener("click", function () { to(cur - 1); restart(); });
      document.getElementById("deck-next").addEventListener("click", function () { to(cur + 1); restart(); });
      Array.prototype.forEach.call(dotBtns, function (b, i) { b.addEventListener("click", function () { to(i); restart(); }); });
      Array.prototype.forEach.call(cards, function (c, i) {
        c.addEventListener("click", function (ev) { if (i !== cur) { ev.preventDefault(); to(i); restart(); } });
      });
      var sx = null, moved = false;
      deck.addEventListener("pointerdown", function (e) { sx = e.clientX; moved = false; });
      deck.addEventListener("pointerup", function (e) {
        if (sx === null) { return; }
        var dx = e.clientX - sx; sx = null;
        if (Math.abs(dx) > 40) { moved = true; to(cur + (dx < 0 ? 1 : -1)); restart(); }
      });
      deck.addEventListener("click", function (e) { if (moved) { e.preventDefault(); moved = false; } }, true);
      if (narrow.addEventListener) { narrow.addEventListener("change", layout); }
      setPlay(playing);
      layout();
    }
  })();
</script>
